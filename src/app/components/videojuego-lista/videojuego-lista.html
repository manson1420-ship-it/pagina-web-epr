<section class="lista">
  <h2>Lista de videojuegos</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Desarrollador</th>
        <th>Fecha de lanzamiento</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      @for (videojuego of videojuegos; track videojuego.id) {
        <tr>
          <td>{{ videojuego.id }}</td>
          <td>{{ videojuego.titulo }}</td>
          <td>{{ videojuego.desarrollador }}</td>
          <td>{{ videojuego.fecha_lanzamiento }}</td>
          <td>
            <button (click)="ver.emit(videojuego)">Ver</button>
            <button (click)="editar.emit(videojuego)">Editar</button>

            <app-videojuego-eliminar
              [id]="videojuego.id"
              (eliminar)="eliminar.emit($event)">
            </app-videojuego-eliminar>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
